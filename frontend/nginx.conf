server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Fichiers statiques versionnés : cache long
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single Page Application : toutes les routes renvoient index.html (React Router)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
